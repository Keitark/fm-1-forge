name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Offline bridge and store contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Python contracts
        run: python -m unittest discover -s tools/jieli-wl82 -p 'test_*.py'
      - name: Browser store contracts
        run: node --test tools/jieli-wl82/test_remote_store.cjs tools/jieli-wl82/test_remote_library_ui.cjs

  site:
    name: Site contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Site dependencies
        run: npm ci --prefix site
      - name: Site contracts
        run: node --test site/test/*.test.mjs
      - name: Typecheck Site
        working-directory: site
        run: npx --no-install tsc --noEmit
      - name: Build Site
        run: npm run build --prefix site


  desktop:
    name: Windows native MIDI and stock writer contracts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install build and contract dependencies
        run: npm ci --prefix site
      - name: Use canonical native test storage paths
        shell: pwsh
        run: |
          $canonicalTemp = node --input-type=module -e 'import { realpathSync } from "node:fs"; console.log(realpathSync(process.env.RUNNER_TEMP));'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TEMP=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Offline native plugin contracts
        shell: pwsh
        run: |
          $desktopTests = Get-ChildItem desktop/test -Filter '*.test.mjs' | Select-Object -ExpandProperty FullName
          node --test $desktopTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stockTests = Get-ChildItem tools/jieli-wl82/stock-sysex/test -Filter '*.test.mjs' | Select-Object -ExpandProperty FullName
          node --test $stockTests
          exit $LASTEXITCODE
